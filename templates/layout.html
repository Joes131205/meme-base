<!DOCTYPE html>

<html lang="en">

    <head>
        <title>MemeBase - {% block title %}{% endblock %}</title>
        <meta name="viewport" content="initial-scale=1, width=device-width">
        <link href="/static/styles.css" rel="stylesheet">
        <link href="/static/favicon.ico" rel="icon">
        <meta charset="utf-8">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Karla:ital,wght@0,200;0,300;0,400;0,500;0,600;0,700;0,800;1,200;1,300;1,400;1,500;1,600;1,700;1,800&display=swap" rel="stylesheet">
    </head>

    <body>
        <nav>
            <h1>Meme Generator</h1>
            <div>
                {% if session["user_id"] %}
                    <ul>
                        <li><a href="/">Meme Home Base</a></li>
                        <li><a href="/inventory">Meme Inventory</a></li>
                        <li><a href="/logout">Log Out</a></li>
                    </ul>
                {% else %}
                    <ul>
                        <li><a href="/register">Register</a></li>
                        <li><a href="/login">Log In</a></li>
                    </ul>
                {% endif %}
            </div>
        </nav>
        {% if get_flashed_messages() %}
            <header>
                <script>
                    alert("{{ get_flashed_messages() | join(' ') }}");
                </script>
            </header>
        {% endif %}
        <main class="container-fluid py-5 text-center" style="height:100%">
            {% block main %}{% endblock %}
        </main>
    </body>

</html>
