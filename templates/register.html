{% extends "layout.html" %}
{% block title %}
    Register
{% endblock %}
{% block main %}
    <div id="register">
        <h2>Register</h2>
        <form action="/register" method="post">
            <input id="username" name="username" placeholder="Username" type="text" autocomplete="off">
            <input id="password" name="password" placeholder="Password" type="password" autocomplete="off">
            <input id="confirmation" name="confirmation" placeholder="Confirmation Password" type="password" autocomplete="off">
            <button type="submit">Register</button>
        </form>
    </div>

{% endblock %}
